# Jalankan di VPS: docker compose up -d --build
# Isi .env dulu (salin dari .env.example). DOMAIN dipakai Caddy untuk sertifikat HTTPS otomatis.
services:
  app:
    build:
      context: .
      args:
        APP_URL: ${APP_URL}
    env_file: .env
    environment:
      DATABASE_URL: file:/app/data/ruangloker.db
      VAULT_DIR: /app/data/vault
      BACKUP_DIR: /app/backups
      TRUST_PROXY: '1'
    volumes:
      - ./data:/app/data
      - ./backups:/app/backups
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - '80:80'
      - '443:443'
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
